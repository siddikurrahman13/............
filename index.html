<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Forever Archive 2.0</title><link rel="stylesheet" href="style.css"></head><body>
<div id="lock"><div class="lock"><h1>❤️ Our Forever Archive</h1><p>Some conversations are too precious to disappear.</p><input id="pass" type="password" placeholder="Create / enter password"><button onclick="unlock()">Open Our Memories ✨</button><small id="err"></small></div></div>
<div id="app" class="hidden"><aside><h2>❤️ Forever Archive</h2><button onclick="view('home')">🏠 Dashboard</button><button onclick="view('chat')">💬 Timeline</button><button onclick="view('fav')">⭐ Favorites</button><button onclick="view('flash')">🪄 Flashback</button><button onclick="view('stats')">📊 Statistics</button><hr><button onclick="addProfile()">👤 Add Person</button><button onclick="chooseImport()">📥 Import WhatsApp Chat</button><input id="file" type="file" accept=".txt" hidden><hr><button onclick="backup()">⬇ Export Backup</button><button onclick="restorePick()">↩ Restore Backup</button><input id="restore" type="file" accept=".json" hidden><button onclick="clearAll()">🗑 Clear Archive</button></aside>
<main><section id="home" class="page"><h1>Our Memory Dashboard ❤️</h1><div id="cards" class="cards"></div><div class="panel"><h3>👤 Memory Profiles</h3><div id="profiles"></div></div><div class="panel"><h3>🪄 On This Day</h3><div id="today"></div></div></section>
<section id="chat" class="page hidden"><h1>Combined Memory Timeline 💬</h1><div class="filters"><select id="person" onchange="renderChat()"><option value="all">All People</option></select><select id="source" onchange="renderChat()"><option value="all">All Numbers / Sources</option></select><input id="date" type="date" onchange="renderChat()"><input id="search" placeholder="🔍 Search message" oninput="renderChat()"><button onclick="clearFilters()">Clear</button></div><div class="day"><button onclick="move(-1)">← Previous Day</button><b id="dayLabel">All Memories</b><button onclick="move(1)">Next Day →</button></div><div id="messages"></div></section>
<section id="fav" class="page hidden"><h1>⭐ Favourite Memories</h1><div id="favList"></div></section>
<section id="flash" class="page hidden"><div class="flash"><h1>🪄 Memory Flashback</h1><h3 id="flashTitle"></h3><div id="flashList"></div><button onclick="flash()">🎲 Another Memory ❤️</button></div></section>
<section id="stats" class="page hidden"><h1>📊 Statistics</h1><div id="statsCards" class="cards"></div><div class="panel"><h3>📱 Sources</h3><div id="sources"></div></div></section></main></div>
<script src="app.js"></script></body></html>
