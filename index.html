<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Forever Archive 3.0</title><link rel="stylesheet" href="style.css"></head><body>
<div id="lock"><div class="box"><h1>❤️ Our Forever Archive</h1><p>Some conversations are too precious to disappear.</p><input id="pass" type="password" placeholder="Create or enter password"><button id="open">Open Our Memories ✨</button><small id="err"></small></div></div>
<div id="app" hidden><aside><h2>❤️ Forever Archive 3.0</h2><button data-page="home">🏠 Dashboard</button><button data-page="chat">💬 Timeline</button><button data-page="fav">⭐ Favorites</button><button data-page="flash">🪄 Flashback</button><button data-page="stats">📊 Statistics</button><hr><button id="add">👤 Add Person</button><button id="import">📥 Import WhatsApp Chat</button><input id="txt" type="file" accept=".txt" hidden><hr><button id="export">⬇ Export Backup</button><button id="restore">↩ Restore Backup</button><input id="json" type="file" accept=".json" hidden><button id="clear">🗑 Clear Archive</button></aside><main>
<section id="home"><h1>Dashboard ❤️</h1><div id="cards" class="cards"></div><div class="panel"><h3>Profiles</h3><div id="profiles"></div></div></section>
<section id="chat" hidden><h1>Combined Timeline 💬</h1><div class="filters"><select id="person"></select><select id="source"></select><input id="date" type="date"><input id="search" placeholder="🔍 Search messages"><button id="reset">Clear</button></div><div class="nav"><button id="prev">← Previous Day</button><b id="day">All Memories</b><button id="next">Next Day →</button></div><p id="count"></p><div id="list"></div><button id="more">Load More</button></section>
<section id="fav" hidden><h1>⭐ Favourite Memories</h1><div id="favlist"></div><button id="favmore">Load More</button></section>
<section id="flash" hidden><div class="panel"><h1>🪄 Memory Flashback</h1><h3 id="flashtitle"></h3><div id="flashlist"></div><button id="flashbtn">Another Memory ❤️</button></div></section>
<section id="stats" hidden><h1>📊 Statistics</h1><div id="statcards" class="cards"></div></section></main></div><script src="app.js"></script></body></html>
